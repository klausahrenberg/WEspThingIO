; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp12e]
monitor_speed = 115200
monitor_echo = on
monitor_filters = 
  send_on_enter
  esp32_exception_decoder
platform = espressif8266
board = esp12e
framework = arduino
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.1m.ld
upload_resetmethod = nodemcu
upload_speed = 921600
; add -DW_NO_UI to leave out the control page (/ui), it saves about 11 kB of flash
; and the heap the page needs. The web thing api (/, /things/...) is not affected.
build_flags =
    -I ../WAdapter/src
lib_ldf_mode = deep
lib_deps =
    ESP32Async/ESPAsyncWebServer@3.7.2
    links2004/WebSockets
    ESP8266mDNS
    DNSServer
    EEPROM
    NTPClient
    Time
    Hash
    Wire
    Adafruit NeoPixel


; the same firmware without the log output, about 5 kB smaller
[env:esp12e_release]
extends = env:esp12e
build_flags =
    ${env:esp12e.build_flags}
    -DW_NO_LOG


[env:esp32dev]
monitor_speed = 9600
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
upload_speed = 921600
build_flags =
	-I ../WAdapter/src
	-DCORE_DEBUG_LEVEL=0
board_build.partitions = min_spiffs.csv
lib_ldf_mode = deep
lib_deps =
	WiFi
	ESP32Async/ESPAsyncWebServer
	ESP32Async/AsyncTCP
    https://github.com/Links2004/arduinoWebSockets
	ESPmDNS
	DNSServer
	FS
	Update
	EEPROM
	Wire
	Adafruit NeoPixel